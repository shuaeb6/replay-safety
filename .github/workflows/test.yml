name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
      - name: JS tests
        run: npm test
      - name: Python tests
        run: uv run --python 3.12 --with pytest pytest tests -q
      - name: Generated regulation files are current
        run: uv run --python 3.12 scripts/build_regulations_table.py --check
