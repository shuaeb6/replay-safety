name: CI

on:
  pull_request:
  push:
    branches: [main]

# One deploy at a time. A newer push waits until the current deploy finishes.
concurrency:
  group: replay-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
      - name: JavaScript tests
        run: npm test
      - name: Python tests
        run: uv run --python 3.12 --with pytest pytest tests -q
      - name: Regulation tables are current
        run: uv run --python 3.12 scripts/build_regulations_table.py --check

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The cluster API is on the workshop network. This job runs on a runner
    # registered on that VM with the label "replay", where /config and kubectl exist.
    runs-on: [self-hosted, replay]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the live board
        run: bash tools/deploy_live.sh
