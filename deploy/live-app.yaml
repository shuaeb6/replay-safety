apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-safety
  labels:
    app: replay-safety
spec:
  replicas: 1
  selector:
    matchLabels:
      app: replay-safety
  template:
    metadata:
      labels:
        app: replay-safety
    spec:
      containers:
      - name: app
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        workingDir: /code
        command: ["python", "main.py"]
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: VSS_URL
          valueFrom:
            secretKeyRef:
              name: replay-safety-vss-creds
              key: VSS_URL
        - name: VSS_USERNAME
          valueFrom:
            secretKeyRef:
              name: replay-safety-vss-creds
              key: VSS_USERNAME
        - name: VSS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: replay-safety-vss-creds
              key: VSS_PASSWORD
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: replay-safety-vss-creds
              key: WANDB_API_KEY
        - name: WANDB_TEAM
          valueFrom:
            secretKeyRef:
              name: replay-safety-vss-creds
              key: WANDB_TEAM
        - name: WANDB_PROJECT
          valueFrom:
            secretKeyRef:
              name: replay-safety-vss-creds
              key: WANDB_PROJECT
        - name: GPU_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: replay-safety-vss-creds
              key: GPU_BEARER_TOKEN
        volumeMounts:
        - name: code
          mountPath: /code
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: code
        configMap:
          name: replay-safety-code
---
apiVersion: v1
kind: Service
metadata:
  name: replay-safety
  labels:
    app: replay-safety
spec:
  selector:
    app: replay-safety
  ports:
  - name: http
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: replay-safety
  labels:
    app: replay-safety
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: __APP_HOST__
    http:
      paths:
      - path: /app(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: replay-safety
            port:
              number: 80
